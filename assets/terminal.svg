  viewBox="0 0 780 420" role="img" aria-label="Animated terminal">
  
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1"   stop-color="#39FF14"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F5FF" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="780" height="420" rx="14" fill="url(#glass)"
        stroke="url(#neon)" stroke-width="1.3"/>
  <rect width="780" height="420" rx="14" fill="url(#scan)"/>

