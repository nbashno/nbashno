<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220"
    viewBox="0 0 1000 220" role="img" aria-label="Live GitHub dashboard">
    
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1"   stop-color="#39FF14"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00F5FF" stroke-width="0.4" stroke-opacity="0.10"/>
    </pattern>
    
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F5FF" opacity="0.03"/>
    </pattern>
  </defs>
    <rect width="1000" height="220" rx="16" fill="#05060A"/>
    <rect width="1000" height="220" rx="16" fill="url(#grid)"/>
    <text x="40" y="42" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5A6B82"
          letter-spacing="3">LIVE GITHUB DASHBOARD</text>
    <circle cx="230" cy="38" r="4" fill="#39FF14" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="245" y="42" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11" fill="#39FF14">LIVE</text>
    
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.00s" fill="freeze"/>
        <rect x="40" y="70" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="40" y="70" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="62" y="100" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">REPOSITORIES</text>
        <text x="62" y="132" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">3</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.12s" fill="freeze"/>
        <rect x="360" y="70" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="360" y="70" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="382" y="100" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">STARS</text>
        <text x="382" y="132" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">1</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.24s" fill="freeze"/>
        <rect x="680" y="70" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="680" y="70" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="702" y="100" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">FOLLOWERS</text>
        <text x="702" y="132" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">1</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.36s" fill="freeze"/>
        <rect x="40" y="168" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="40" y="168" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="62" y="198" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">FORKS</text>
        <text x="62" y="230" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">0</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.48s" fill="freeze"/>
        <rect x="360" y="168" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="360" y="168" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="382" y="198" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">FOLLOWING</text>
        <text x="382" y="230" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">1</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.60s" fill="freeze"/>
        <rect x="680" y="168" width="300" height="78" rx="10"
              fill="url(#glass)" stroke="#1a2332" stroke-width="1"/>
        <rect x="680" y="168" width="4" height="78" rx="2" fill="url(#neon)"/>
        <text x="702" y="198" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="11"
              fill="#5A6B82" letter-spacing="2">CONTRIBUTIONS</text>
        <text x="702" y="230" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="30"
              font-weight="700" fill="url(#neon)" filter="url(#glow)">31</text>
      </g>
    <rect x="1" y="1" width="998" height="218" rx="16" fill="none"
          stroke="url(#neon)" stroke-width="1.3" opacity="0.5"/>
  </svg>