<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120"
    viewBox="0 0 1000 120" role="img" aria-label="footer">
    
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1"   stop-color="#39FF14"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00F5FF" stroke-width="0.4" stroke-opacity="0.10"/>
    </pattern>
    
  </defs>
    <rect width="1000" height="120" fill="#05060A"/>
    <rect width="1000" height="120" fill="url(#grid)"/>
    <line x1="0" y1="4" x2="1000" y2="4" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <text x="500" y="55" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="18" font-weight="700"
          fill="url(#neon)" filter="url(#glow)" text-anchor="middle">
      &lt; keep building &gt;
    </text>
    <text x="500" y="82" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12"
          fill="#5A6B82" text-anchor="middle">
      designed &amp; generated with SVG · auto-updated via GitHub Actions
    </text>
    <circle cx="500" cy="100" r="3" fill="#39FF14" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </svg>