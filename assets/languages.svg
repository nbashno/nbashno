<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"
    viewBox="0 0 500 500" role="img" aria-label="Language radar">
    
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1"   stop-color="#39FF14"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    
  </defs>
    <rect width="500" height="500" rx="16" fill="#05060A"/>
    <text x="30" y="40" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5A6B82"
          letter-spacing="3">LANGUAGE RADAR</text>
    <polygon points="250,222.5 287.5,260 250,297.5 212.5,260" fill="none" stroke="#1a2332"
      stroke-width="0.8" opacity="0.6"/><polygon points="250,185 325,260 250,335 175,260" fill="none" stroke="#1a2332"
      stroke-width="0.8" opacity="0.6"/><polygon points="250,147.5 362.5,260 250,372.5 137.5,260" fill="none" stroke="#1a2332"
      stroke-width="0.8" opacity="0.6"/><polygon points="250,110 400,260 250,410 100,260" fill="none" stroke="#1a2332"
      stroke-width="0.8" opacity="0.6"/><line x1="250" y1="260" x2="250" y2="110"
      stroke="#1a2332" stroke-width="1"/><line x1="250" y1="260" x2="400" y2="260"
      stroke="#1a2332" stroke-width="1"/><line x1="250" y1="260" x2="250" y2="410"
      stroke="#1a2332" stroke-width="1"/><line x1="250" y1="260" x2="100" y2="260"
      stroke="#1a2332" stroke-width="1"/><text x="250" y="80" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12"
      fill="#C6D3E3" text-anchor="middle">TypeScript</text><text x="430" y="260" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12"
      fill="#C6D3E3" text-anchor="middle">JavaScript</text><text x="250" y="440" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12"
      fill="#C6D3E3" text-anchor="middle">CSS</text><text x="70" y="260" font-family="'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="12"
      fill="#C6D3E3" text-anchor="middle">Dockerfile</text>
    <polygon points="250,110 275.9955924916233,260 250,264.1189787070508 248.63811594028846,260" fill="#8A2BE2" fill-opacity="0.25"
      stroke="url(#neon)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="fill-opacity" values="0.12;0.32;0.12" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="250" cy="110" r="4" fill="#00F5FF" filter="url(#glow)"/><circle cx="275.9955924916233" cy="260" r="4" fill="#00F5FF" filter="url(#glow)"/><circle cx="250" cy="264.1189787070508" r="4" fill="#00F5FF" filter="url(#glow)"/><circle cx="248.63811594028846" cy="260" r="4" fill="#00F5FF" filter="url(#glow)"/>
    <rect x="1" y="1" width="498" height="498" rx="16" fill="none"
          stroke="url(#neon)" stroke-width="1.2" opacity="0.5"/>
  </svg>