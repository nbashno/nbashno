<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20"
    viewBox="0 0 1000 20" role="img" aria-label="divider">
    
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E17" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1"   stop-color="#39FF14"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    
  </defs>
    <line x1="0" y1="10" x2="1000" y2="10" stroke="url(#neon)" stroke-width="2"
          filter="url(#glow)" opacity="0.9"/>
    <circle cx="0" cy="10" r="4" fill="#00F5FF" filter="url(#glow)">
      <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </svg>