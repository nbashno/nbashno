name: Snake

# Generates the neon contribution-snake animation into the `output` branch,
# which the README references. Colors match the cyberpunk palette.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dark neon variant; cyan snake eating purple/green cells on black.
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%2300F5FF&color_dots=%23161B22,%238A2BE2,%2339FF14,%2339FF14,%2300F5FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
