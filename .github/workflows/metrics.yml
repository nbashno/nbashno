name: Metrics

# Generates a highly customized metrics panel (assets/metrics.svg) using the
# community metrics action. Requires a classic PAT with `repo` + `read:user`
# stored as the METRICS_TOKEN secret for full data (private contributions, etc).
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          committer_message: "chore: refresh metrics [skip ci]"

          # Custom cyberpunk theme.
          config_timezone: Asia/Amman
          config_display: large
          template: classic

          # Plugins — the "not default layout" the brief asked for.
          base: "header, activity, community, repositories, metadata"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_stargazers: yes
          plugin_lines: yes
